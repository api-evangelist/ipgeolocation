openapi: 3.0.7
info:
  title: 'IPGeolocation.io: Abuse Contact ASN Lookup IP Abuse Contact API'
  version: '3.0'
  description: "Retrieve abuse contact information associated with an IPv4 address or IPv6 address.\nThe API returns the organization responsible for handling abuse complaints related\nto the queried IP address, including the abuse contact role, organization name,\nregistered address, email contacts, and phone numbers.\n\nThe abuse contact data helps organizations report malicious activities such as\nspam, phishing, DDoS attacks, IP spoofing, and other network abuse to the\nresponsible network operator.\n\nOne endpoint is available:\n\n- **Abuse lookup** (`GET /v3/abuse`) returns abuse contact information for a\n  single IPv4 or IPv6 address per request.\n\nUse query parameters to control which fields are returned and which fields are\nexcluded from the response to reduce payload size when only specific data\nis required.\n\n## Authentication\n\nTwo authentication methods are supported:\n\n### API Key\n\nPass your API key as the `apiKey` query parameter on every request. You can find your\nkey in the [IPGeolocation dashboard](https://app.ipgeolocation.io/). Store it in\nserver-side environment variables. Avoid exposing it in client-side JavaScript.\n\n### Request Origin (CORS)\n\nAvailable on paid plans only. Whitelist your domain in the dashboard under the\n\"API Keys\" section. Once configured, requests from that domain (and all its subdomains)\nare accepted without passing `apiKey`. Enter your root domain (e.g. `example.com`),\nnot the full URL.\n\nEach plan has a limit on the number of extra API keys and request origins:\n\n| Plan | Extra API Keys + Request Origins |\n|---|---|\n| Starter (150K requests) | 1 |\n| Core (250K requests) | 1 |\n| Plus (500K requests) | 2 |\n| Pro (1M requests) | 2 |\n| Business (2M requests) | 3 |\n| Premium (5M requests) | 3 |\n\nAdditional keys or origins can be added for $2.50 per month each.\n\n## Response Formats\n\nThe API supports JSON (default) and XML output.\n\n- Set the `output` query parameter to `json` or `xml`.\n- Alternatively, set the `Accept` header to `application/json`, `application/xml`,\n  or `text/xml`.\n\nIf neither is specified, the response is returned as JSON. XML responses use a\n`LinkedHashMap` root element.\n\n## Credit Usage\n\nCredits are charged only for successful **HTTP 200** responses. The exact number of\ncredits consumed by a request is returned in the `X-Credits-Charged` response header.\n\nA **single IP abuse contact lookup** (`GET /v3/abuse`) consumes **1 credit** per request.\n\n\n## Field Filtering\n\nUse `fields` to cherry-pick specific fields, or `excludes` to drop fields you do not\nneed. Both accept dot-notation for nested fields (e.g. `abuse.route`,\n`abuse.organization`). The `ip` field is always present regardless of filters.\n\n## Parameter Name Casing\n\nQuery parameter names are case-sensitive. Use exact names such as\n`apiKey`, `ip`, `fields`, `excludes`, and `output`.\n\n## Plan Availability and Usage Limits\n\nThe IP Abuse Contact API is available **only on paid plans**.\n\nPaid subscriptions do not have fixed daily, hourly, or monthly rate limits.  \nIf the monthly quota is exceeded, requests continue and a surcharge may be applied according to the subscribed plan.\n\nFree plans cannot access the IP Abuse Contact API. Requests made with a free plan API key return **HTTP 401 Unauthorized**.\n"
  contact:
    name: IPGeolocation Support
    url: https://ipgeolocation.io/contact.html
    email: support@ipgeolocation.io
  termsOfService: https://ipgeolocation.io/tos.html
  license:
    name: Proprietary
    url: https://ipgeolocation.io/tos.html
servers:
- url: https://api.ipgeolocation.io
  description: Production
security:
- ApiKeyAuth: []
tags:
- name: IP Abuse Contact
  description: 'API endpoint for retrieving abuse contact information associated

    with IPv4 and IPv6 addresses. The response contains registry-based

    contact details for reporting malicious or abusive network activity

    such as spam, phishing, DDoS attacks, or unauthorized access attempts.

    '
  externalDocs:
    description: IP Abuse Contact API documentation
    url: https://ipgeolocation.io/documentation/ip-abuse-contact-api.html
paths:
  /v3/abuse:
    get:
      operationId: lookupIpAbuseContact
      summary: IPGeolocation.io IP Abuse Contact Lookup
      description: 'Returns abuse contact information for a single IPv4 or IPv6 address.


        The response includes the organization responsible for handling abuse

        complaints related to the queried IP address. This typically contains

        the abuse contact role, organization name, contact emails, phone

        numbers, and the registered address.


        This endpoint is intended for reporting malicious activities such as

        spam, phishing, DDoS attacks, and other network abuse.


        When only abuse contact information is required, using this endpoint is

        recommended instead of `/v3/ipgeo?include=abuse` because it returns a

        smaller response payload and predictable credit usage.


        Each successful lookup consumes **1 credit**.


        Use the `fields` and `excludes` parameters to control which parts of

        the response are returned.

        '
      tags:
      - IP Abuse Contact
      parameters:
      - $ref: '#/components/parameters/Ip'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Excludes'
      - $ref: '#/components/parameters/Output'
      responses:
        '200':
          description: Abuse contact information for the requested IP address.
          headers:
            X-Credits-Charged:
              description: Number of API credits consumed by this request.
              schema:
                type: number
                example: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbuseLookupResponse'
              example:
                ip: 1.0.0.0
                abuse:
                  route: 91.128.0.0/14
                  country: SE
                  name: Swipnet Staff
                  organization: ''
                  kind: group
                  address: Tele2 AB/Swedish IP Network, IP Registry, Torshamnsgatan 17 164 40 Kista SWEDEN
                  emails:
                  - abuse@tele2.com
                  phone_numbers:
                  - +46 8 5626 42 10
            application/xml:
              schema:
                $ref: '#/components/schemas/AbuseLookupResponse'
              example: "<LinkedHashMap>\n  <ip>1.0.0.0</ip>\n  <abuse>\n      <route>1.0.0.0/24</route>\n      <country>AU</country>\n      <name>IRT-APNICRANDNET-AU</name>\n      <organization></organization>\n      <kind>group</kind>\n      <address>PO Box 3646, South Brisbane, QLD 4101, Australia</address>\n      <emails>helpdesk@apnic.net</emails>\n      <phone_numbers>+61738583100</phone_numbers>\n  </abuse>\n</LinkedHashMap>\n"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '499':
          $ref: '#/components/responses/ClientClosedRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        '505':
          $ref: '#/components/responses/HttpVersionNotSupported'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  responses:
    HttpVersionNotSupported:
      description: 'HTTP Version Not Supported. The server does not support the HTTP protocol

        version used in the request.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: HTTP version not supported.
    BadRequest:
      description: "Bad request. Returned for one of the following reasons:\n- The provided IPv4 address or IPv6 address is invalid.\n- Special characters such as ( ) [ ] { } | ^ ` are present in the API URL,\n  either in a parameter name or its value (especially in the API key).\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidIp:
              summary: Invalid IPv4/IPv6 input
              value:
                message: Provided name, service or IP address '999.999.999.999' is not valid.
            specialCharacters:
              summary: Special characters in API URL or key
              value:
                message: Invalid character found in the request target.
    NotFound:
      description: "Not found. Returned for one of the following reasons:\n\n- A syntactically valid IPv4 or IPv6 address does not exist in the IPGeolocation database.\n- An IPv4 address or IPv6 address is passed as a path variable\n  instead of as a URL query parameter (e.g., using `/v3/ipgeo/8.8.8.8`\n  instead of `/v3/ipgeo?ip=8.8.8.8`).\n- A non-existent or incorrect API endpoint is called.\n\nInvalid or malformed IPv4, IPv6, or domain input returns HTTP 400 instead.\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            ipNotInDatabase:
              summary: IPv4/IPv6 not found in database
              value:
                message: Provided IPv4 or IPv6 address does not exist in our database.
            ipAsPathVariable:
              summary: IP passed as path variable instead of query parameter
              value:
                message: No endpoint GET /v3/ipgeo/8.8.8.8.
            wrongEndpoint:
              summary: Incorrect or non-existent endpoint
              value:
                message: No endpoint GET /v3/abuse-invalid.
    MethodNotAllowed:
      description: 'Method Not Allowed. Returned when an unsupported HTTP method is used

        to call an endpoint.


        Only the **GET** method is supported for the Abuse Contact API endpoint.


        Any other HTTP method results in HTTP 405.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            postNotAllowed:
              summary: POST method used
              value:
                message: Request method 'POST' is not supported
            unsupportedMethod:
              summary: Unsupported HTTP method
              value:
                message: Request method is not supported
    Locked:
      description: 'Locked. The provided IP address belongs to a bogon IP range or a private

        network and cannot be looked up.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: '''10.0.0.1'' is a bogon IP address.'
    ServiceUnavailable:
      description: 'Service Unavailable. The API is temporarily unavailable due to maintenance

        or overload. Please try again later.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Service temporarily unavailable. Please try again later.
    BadGateway:
      description: 'Bad Gateway. The API server received an invalid response from an upstream

        server while processing the request. This is usually temporary.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Upstream service error. Please try again later.
    Unauthorized:
      description: 'Unauthorized. Returned for one of the following reasons:


        - The `apiKey` URL parameter is missing.

        - An invalid (random or incorrect) API key is provided.

        - The account has been disabled or locked due to abuse or illegal activity.

        - The API request is made using an API key for a database subscription.

        - The API request is made using a free subscription API key.

        - The subscription is in a ''paused'' state.

        - The subscription trial has expired.

        - The account’s active-until date has passed and renewal or upgrade is required.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missingApiKey:
              summary: Missing API key
              value:
                message: Please provide an API key (as 'apiKey=YOUR_API_KEY' URL parameter) to use IPGeolocation API. To get your free API Key, sign up at https://app.ipgeolocation.io/login
            invalidApiKey:
              summary: Invalid API key
              value:
                message: Provided API key is not valid. Contact technical support for assistance at support@ipgeolocation.io
            lockedAccount:
              summary: Account locked or disabled
              value:
                message: Your account has been locked to use IPGeolocation API. Contact technical support for assistance at support@ipgeolocation.io
            databaseSubscriptionKey:
              summary: Database subscription API key used for REST API
              value:
                message: 'You cannot query IPGeolocation API on a database plan subscription. '
            freePlanAccess:
              summary: Free subscription used for Abuse Contact API
              value:
                message: Abuse Lookup is not supported on your current subscription. This feature is available to Paid subscriptions only.
            pausedSubscription:
              summary: Subscription is paused
              value:
                message: Your subscription has been paused. Please resume your subscription to use IPGeolocation API.
            expiredSubscription:
              summary: Subscription expired or trial ended
              value:
                message: Your subscription has expired at DATE. Please subscribe to a paid plan to continue using IPGeolocation API without interruption or contact technical support for assistance at support@ipgeolocation.io
    ClientClosedRequest:
      description: 'The client closed the connection before the server finished processing the

        request. This usually happens when the client sets a very short request or

        connection timeout. Increase the timeout on the client side.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Client closed the request before the server could respond.
    GatewayTimeout:
      description: 'Gateway Timeout. The API server did not receive a timely response from

        an upstream server.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: The server timed out while processing the request.
    TooManyRequests:
      description: "Too Many Requests. Returned for one of the following reasons:\n- The API usage limit has been reached for a Paid subscription with\n  status 'past due', 'deleted', or 'trial expired'.\n- The surcharge API usage limit has been reached for the subscribed plan.\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            usageLimitReached:
              summary: API usage limit reached
              value:
                message: You have exceeded the limit of PLAN_USAGE_LIMIT requests per PLAN_INERVAL for your subscribed PLAN plan. Please throttle your requests or upgrade your plan to continue using IPGeolocation API without interruption.
            surchargeLimitReached:
              summary: Surcharge usage limit reached
              value:
                message: You have reached the surcharge amount limit of PLAN_USAGE_LIMIT_AND_SURCHARGE_LIMIT on your subscribed PLAN plan. Please throttle your requests or upgrade your plan to continue using IPGeolocation API without interruption.
    InternalServerError:
      description: 'Internal Server Error. The server encountered an unexpected condition

        that prevented it from fulfilling the request. If the issue persists,

        contact support@ipgeolocation.io.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Something went wrong on the server side.
  parameters:
    Fields:
      name: fields
      in: query
      required: false
      description: 'Comma-separated list of fields or objects to return. Everything else is omitted.

        The `ip` field is always returned regardless of this filter.


        Supports dot-notation for nested fields: `abuse.route`, `abuse.organization`.


        If the same field or object is specified in both `fields` and `excludes`, the

        object is still returned, but it will be empty.


        If you list both an object key and one of its nested fields separated by comma

        (e.g. `abuse,abuse.name`), the full object is returned.


        Unknown field paths are ignored. The API still returns HTTP 200.


        Available on all plans including Free.

        '
      schema:
        type: string
      examples:
        none:
          summary: Return the full response (no field filtering)
          value: ''
        countryOnly:
          summary: Return only the country field
          value: abuse.country
        moreThanOneFields:
          summary: Return specific fields
          value: abuse.name,abuse.organization
    Ip:
      name: ip
      in: query
      required: false
      description: 'An IPv4 address or IPv6 address to look up. When omitted, the API

        resolves the public IP of the requesting client. Empty or whitespace-only values

        are treated the same as omission and resolve caller IP. Pass `ip` only once. If multiple `ip` query parameters are sent,

        values may be merged and treated as invalid input (HTTP 400).

        '
      schema:
        type: string
      examples:
        ipv4:
          summary: IPv4 address
          value: 91.128.103.196
        ipv6:
          summary: IPv6 address
          value: 2607:fb91:16c6:8860:e531:2d1d:4944:6c7c
    Excludes:
      name: excludes
      in: query
      required: false
      description: 'Comma-separated list of fields or objects to remove from the response. The `ip`

        field cannot be excluded.


        Supports dot-notation for nested fields: `abuse.name`.


        If the same field or object is specified in both `fields` and `excludes`, the

        object is still returned, but it will be empty.


        Unknown fields or object keys in `excludes` are ignored. The API still returns

        HTTP 200.


        Available on all plans including Free.

        '
      schema:
        type: string
      examples:
        none:
          summary: Do not exclude any fields
          value: ''
        excludeObjects:
          summary: Exclude address and emails
          value: abuse.address,abuse.emails
    Output:
      name: output
      in: query
      required: false
      description: 'Desired response format. Defaults to `json` if not specified. You can also

        control the format using the `Accept` header (`application/json`,

        `application/xml`, or `text/xml`). If both are provided, the `output` parameter

        takes precedence.


        If `output` is unknown or unsupported, it is ignored and the response defaults

        to JSON (`application/json`) with HTTP 200.

        '
      schema:
        type: string
        enum:
        - json
        - xml
        default: json
  schemas:
    ErrorResponse:
      type: object
      description: 'Returned for any non-200 response. Contains only a human-readable `message`.

        Message text can vary by status and condition; examples in this spec are

        representative, not exhaustive, and should not be treated as stable machine

        codes.

        '
      required:
      - message
      properties:
        message:
          type: string
          description: Human-readable explanation of what went wrong. Use HTTP status for control flow.
          example: Provided name, service or IP address '999.999.999.999' is not valid.
    Abuse:
      type: object
      description: 'Abuse contact information for the network that owns this IP. Costs 1 credit.

        '
      properties:
        route:
          type: string
          description: BGP route prefix this abuse contact is responsible for, in CIDR notation.
          example: 91.128.0.0/14
        country:
          type: string
          description: ISO 3166-1 alpha-2 country of the abuse contact. May be empty.
          example: SE
        name:
          type: string
          description: Name of the abuse contact person or team.
          example: Swipnet Staff
        organization:
          type: string
          description: Organization name of the abuse contact. May be empty.
          example: ''
        kind:
          type: string
          description: 'Contact type from registry data. Values include `group`, `individual`.

            '
          example: group
        address:
          type: string
          description: Postal address of the abuse contact. Returned as a plain comma-separated string.
          example: Tele2 AB/Swedish IP Network, IP Registry, Torshamnsgatan 17 164 40 Kista SWEDEN
        emails:
          type: array
          description: Email addresses for reporting abuse.
          items:
            type: string
            format: email
          examples:
          - abuse@tele2.com
        phone_numbers:
          type: array
          description: Phone numbers for the abuse contact.
          items:
            type: string
          examples:
          - +46 8 5626 42 10
    AbuseLookupResponse:
      type: object
      xml:
        name: LinkedHashMap
      description: 'Response returned by the IP Abuse Contact API.


        Contains the queried IP address and the abuse contact information

        associated with the network responsible for that IP.


        The `ip` field is always present. The `abuse` object may be partially

        populated depending on available registry data and field filtering.

        '
      required:
      - ip
      - abuse
      properties:
        ip:
          type: string
          description: 'The IP address for which abuse contact details are returned.

            '
          example: 1.0.0.0
        abuse:
          $ref: '#/components/schemas/Abuse'
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: query
      name: apiKey
      description: 'API key passed as the `apiKey` query parameter. Get yours from the

        [IPGeolocation dashboard](https://app.ipgeolocation.io/). For client-side

        usage, consider using Request Origin (CORS) authentication instead to

        avoid exposing your key.

        '
externalDocs:
  description: IPGeolocation Abuse Contact API documentation
  url: https://ipgeolocation.io/documentation/ip-abuse-contact-api.html
