meters:
  - name: api_credits
    unit: request
    aggregation: sum
    dimensions:
      - api_product
      - endpoint
      - http_method
      - response_code
  - name: api_credits_overage
    unit: request
    aggregation: sum
    dimensions:
      - plan
      - overage_block
  - name: bulk_entries
    unit: entry
    aggregation: sum
    dimensions:
      - bulk_endpoint
  - name: plan_subscription
    unit: month
    aggregation: count
    dimensions:
      - plan
      - billing_cycle
  - name: mmdb_database_licence
    unit: month
    aggregation: count
    dimensions:
      - database_tier
      - bundle
      - dataset
  - name: mmdb_downloads
    unit: download
    aggregation: count
    dimensions:
      - database_tier
      - file
principles:
  - name: Visibility
    description: >-
      Track consumption in the IPGeolocation dashboard
      (app.ipgeolocation.io), which exposes per-day and per-month credit
      counts, current plan quota, overage band, and per-endpoint breakdowns.
      Surface the same data in customer FinOps tooling by polling the
      dashboard or scraping the daily billing summary.
  - name: Allocation
    description: >-
      Allocate credits by issuing one API key per team, app, or environment
      (the dashboard supports multiple keys under one account). Tag
      downstream usage with the API product (geo, security, asn, abuse,
      timezone, astronomy, user-agent) and the call site so cross-charges
      can be modeled against the shared monthly quota.
  - name: Optimization
    description: >-
      Three primary levers: (1) prefer bulk endpoints over per-IP loops to
      reduce HTTP round-trips (cost is identical but throughput improves);
      (2) cache geolocation/ASN lookups locally — IP-to-country mappings are
      stable enough to justify a TTL of 24h+ for personalization;
      (3) for high-volume offline use, move to the MMDB database tier
      (Geo Standard / Geo Advance / Security Pro) where the unit economics
      collapse vs. per-call API pricing. Annual billing also yields roughly
      two months free.
  - name: Accountability
    description: >-
      Designate a single account owner who reviews the monthly invoice in
      the dashboard, sets up email alerts on quota at 50/80/100%, and
      reconciles overage charges back to the team or product that drove
      them. Rotate API keys quarterly to enforce ownership.
