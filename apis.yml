features:
  - name: 7-Product API Suite
    description: >-
      IP Geolocation, IP Security, ASN Lookup, Abuse Contact, Timezone,
      Astronomy, and User-Agent parsing — all behind one API key.
  - name: Bulk Endpoints
    description: >-
      Bulk lookup endpoints (up to 50,000 entries per request) for IP
      geolocation, IP security, and user-agent parsing on paid plans.
  - name: 14 Official SDKs
    description: >-
      First-party SDKs for PHP, Python, Java, JavaScript, TypeScript, Node,
      Ruby, Go, .NET, Kotlin, Swift, Rust, C++, and jQuery.
  - name: MCP Server
    description: >-
      Official Model Context Protocol server exposing every product (geo,
      security, ASN, timezone, astronomy, user-agent) as MCP tools for
      Claude, Cursor, Copilot, and other MCP-aware clients.
  - name: Edge and Platform Integrations
    description: >-
      Vercel edge middleware, Cloudflare-friendly client, Steampipe plugin,
      Elasticsearch ingest processor, n8n node, Google Sheets add-on,
      Splunk app, and WordPress / Shopify / Pipedream / Zapier / Make
      integrations.
  - name: MMDB Database Products
    description: >-
      Downloadable MMDB databases for offline geolocation, security, ASN,
      company, abuse-contact, WHOIS, hosting, and residential-proxy lookups
      (Geo Standard, Geo Advance, Security Pro tiers).
useCases:
  - name: Personalize and Localize Web Experiences
    description: >-
      Detect a visitor's country, currency, and timezone to tailor language,
      pricing, and content at the edge.
  - name: Compliance and Geo-Blocking
    description: >-
      Enforce sanctions, age-gates, or licensing rules by blocking or
      redirecting traffic from specific countries or networks at the
      Vercel/CDN edge.
  - name: Fraud and Abuse Prevention
    description: >-
      Score signups, logins, and transactions using VPN/proxy/Tor detection,
      threat scoring, and ASN type (hosting vs residential).
  - name: SOC Triage and Takedown
    description: >-
      Resolve abuse contacts and ASN owners for IOCs during incident response
      and abuse reporting.
  - name: Scheduling and Astronomy
    description: >-
      Power scheduling, lighting automation, agriculture, and observatory
      tooling with high-precision sunrise/sunset and moon-phase data.
  - name: Audience Analytics
    description: >-
      Enrich logs and analytics events with country, city, ISP, and device
      info to segment users and dashboards.
integrations:
  - name: Vercel Edge Middleware
    description: Geo-block, redirect, and detect VPN/proxy/Tor at the Vercel edge.
  - name: Splunk App
    description: Enrich Splunk events with IP intelligence.
  - name: Elasticsearch Ingest Processor
    description: Enrich documents indexed into Elasticsearch.
  - name: Steampipe Plugin
    description: Query IP intelligence via SQL.
  - name: n8n Node
    description: First-party node for n8n workflow automation.
  - name: Google Sheets Add-on
    description: Look up IPs directly from spreadsheets.
  - name: Zapier
    description: Trigger workflows on IP intelligence enrichment.
  - name: Make (Integromat)
    description: Compose IP lookups into Make scenarios.
  - name: Pipedream
    description: Source step for Pipedream automations.
  - name: WordPress Plugin
    description: Personalize and protect WordPress sites.
  - name: Shopify App
    description: Geo-route Shopify customers and enforce regional rules.
  - name: Microsoft Copilot Connector
    description: Surface IP intelligence inside Microsoft Copilot.
  - name: Maltego Transform
    description: Pivot from IP to ASN, geo, and security in Maltego investigations.
solutions:
  - name: Real-Time API Lookup
    description: Sub-50ms IP intelligence over HTTPS with a single API key.
  - name: Downloadable MMDB Databases
    description: >-
      Offline-capable MMDB files (Geo Standard, Geo Advance, Security Pro)
      for embedded or air-gapped use cases.
  - name: Edge-Native Integrations
    description: >-
      Drop-in middleware for Vercel, Cloudflare Workers, and other edge
      runtimes for personalization and geo-blocking without an extra hop.
