features:
  - name: 7-Product API Suite
    description: >-
      IP Geolocation, IP Security, ASN Lookup, Abuse Contact, Timezone, Astronomy, and User-Agent parsing — all behind
      one API key.
  - name: Bulk Endpoints
    description: >-
      Bulk lookup endpoints (up to 50,000 entries per request) for IP geolocation, IP security, and user-agent parsing
      on paid plans.
  - name: 14 Official SDKs
    description: >-
      First-party SDKs for PHP, Python, Java, JavaScript, TypeScript, Node, Ruby, Go, .NET, Kotlin, Swift, Rust, C++,
      and jQuery.
  - name: MCP Server
