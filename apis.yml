aid: ipgeolocation
name: IPGeolocation.io
description: >-
  IPGeolocation.io is a multi-product IP intelligence platform offering IP
  geolocation, IP security/threat intelligence, ASN lookup, abuse contact,
  timezone, astronomy (sunrise, sunset, moon phase, celestial position), and
  user-agent parsing APIs. All endpoints are served under
  https://api.ipgeolocation.io with API-key authentication. The free plan
  offers 1,000 credits/day; paid plans (Starter through Premium) scale from
  150K to 5M requests/month, with custom Enterprise pricing on top.
url: https://ipgeolocation.io/
specificationVersion: '0.20'
created: '2026-05-28'
modified: '2026-05-29'
x-source: public-apis/public-apis
x-category: Geocoding
x-type: company
x-tier: 3
x-tier-reason: bulk-registered-from-public-apis
tags:
  - Geocoding
  - IP Geolocation
  - IP Intelligence
  - IP Security
  - ASN Lookup
  - Abuse Contact
  - Timezone
  - Astronomy
  - User Agent
  - Threat Intelligence
  - Public APIs
apis:
  - name: IP Geolocation
    description: >-
      Resolve any IPv4 / IPv6 address or domain name to a rich geolocation
      payload — country, region, city, lat/long, postal, currency, ASN,
      company, timezone, security signals, abuse contact, and user-agent
      enrichment. Includes single lookup (GET /v3/ipgeo) and bulk lookup
      (POST /v3/ipgeo-bulk, up to 50,000 entries per request, paid plans).
    humanURL: https://ipgeolocation.io/ip-location-api.html
    baseURL: https://api.ipgeolocation.io
    tags:
      - IP Geolocation
      - Geocoding
      - IP Intelligence
    properties:
      - type: Documentation
        url: https://ipgeolocation.io/documentation/ip-geolocation-api.html
      - type: OpenAPI
        url: openapi/ipgeolocation-ip-location-openapi.yml
      - type: SDK
        title: PHP SDK
        url: https://github.com/IPGeolocation/ip-geolocation-api-php
