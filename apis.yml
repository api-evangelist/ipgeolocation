  - name: IP Security
    description: >-
      Threat-intelligence API that detects VPNs, proxies, Tor exit nodes,
      relay networks, bot activity, spam sources, residential proxies, cloud
      and data-center IPs, and assigns a threat score. Single lookup
      (GET /v3/security) and bulk lookup (POST /v3/security-bulk).
    humanURL: https://ipgeolocation.io/ip-security-api.html
    baseURL: https://api.ipgeolocation.io
    tags:
      - IP Security
      - Threat Intelligence
      - VPN Detection
      - Proxy Detection
    properties:
      - type: Documentation
        url: https://ipgeolocation.io/documentation/ip-security-api.html
      - type: OpenAPI
        url: openapi/ipgeolocation-security-openapi.yml
      - type: NaftikoCapability
        url: capabilities/security-ip-security.yaml
  - name: ASN Lookup
    description: >-
      Resolve an IP or ASN to Autonomous System metadata — owning organization,
      country, type (ISP, hosting, education, government), IP ranges, peers,
      and upstream/downstream relationships.
    humanURL: https://ipgeolocation.io/asn-api.html
    baseURL: https://api.ipgeolocation.io
    tags:
      - ASN Lookup
      - Network Intelligence
    properties:
      - type: Documentation
        url: https://ipgeolocation.io/documentation/asn-api.html
      - type: OpenAPI
        url: openapi/ipgeolocation-asn-openapi.yml
      - type: NaftikoCapability
        url: capabilities/asn-asn-lookup.yaml
  - name: IP Abuse Contact
    description: >-
      Registry-sourced abuse contact information for any IPv4/IPv6 address —
      RIR, abuse email, network/route, country, and registry metadata. Useful
      for security operations, takedown workflows, and compliance.
    humanURL: https://ipgeolocation.io/abuse-contact-api.html
    baseURL: https://api.ipgeolocation.io
    tags:
      - Abuse Contact
      - Security Operations
    properties:
      - type: Documentation
        url: https://ipgeolocation.io/documentation/abuse-contact-api.html
      - type: OpenAPI
        url: openapi/ipgeolocation-abuse-openapi.yml
      - type: NaftikoCapability
        url: capabilities/abuse-ip-abuse-contact.yaml
  - name: Timezone
    description: >-
      Resolve a timezone from name (e.g. America/New_York), IP address, or
      lat/long coordinates. Returns current date/time, UTC offset, DST status,
      DST transition windows, airport/locode metadata, and a convert endpoint
      to translate a timestamp between two zones.
    humanURL: https://ipgeolocation.io/timezone-api.html
    baseURL: https://api.ipgeolocation.io
    tags:
      - Timezone
      - Date and Time
    properties:
      - type: Documentation
        url: https://ipgeolocation.io/documentation/timezone-api.html
      - type: OpenAPI
        url: openapi/ipgeolocation-timezone-openapi.yml
      - type: NaftikoCapability
        url: capabilities/timezone-timezone.yaml
  - name: Astronomy
    description: >-
      Astronomy data for any date and location — sunrise, sunset, solar noon,
      civil/nautical/astronomical twilight phases, moonrise, moonset, moon
      phase, illumination percentage, and altitude/azimuth for the sun and
      moon. Includes a /astronomy/timeSeries endpoint for date ranges.
    humanURL: https://ipgeolocation.io/astronomy-api.html
    baseURL: https://api.ipgeolocation.io
    tags:
      - Astronomy
      - Sunrise Sunset
      - Moon Phase
    properties:
      - type: Documentation
        url: https://ipgeolocation.io/documentation/astronomy-api.html
      - type: OpenAPI
        url: openapi/ipgeolocation-astronomy-openapi.yml
      - type: NaftikoCapability
        url: capabilities/astronomy-astronomy.yaml
  - name: User Agent
    description: >-
      Parse a User-Agent string into browser, engine, device, and operating
      system attributes. Supports single (GET /v3/user-agent — header-based,
      or POST /v3/user-agent — body-based) and bulk lookup (POST
      /v3/user-agent-bulk).
    humanURL: https://ipgeolocation.io/user-agent-api.html
    baseURL: https://api.ipgeolocation.io
    tags:
      - User Agent
      - Device Detection
      - Browser Detection
    properties:
      - type: Documentation
        url: https://ipgeolocation.io/documentation/user-agent-api.html
      - type: OpenAPI
        url: openapi/ipgeolocation-user-agent-openapi.yml
      - type: NaftikoCapability
        url: capabilities/user-agent-user-agent.yaml
